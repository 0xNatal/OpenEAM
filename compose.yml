# Docker Compose for local development. Currently runs only Postgres; the apps
# run via `pnpm dev`. App containers will be added back later (see docs/IDEAS.md).
name: openeam

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openeam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openeam}
      POSTGRES_DB: ${POSTGRES_DB:-openeam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openeam} -d ${POSTGRES_DB:-openeam}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

<!doctype html>
<!-- Vite HTML entry point. Vite injects the bundled JS; /src/main.tsx mounts the React SPA into #root. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenEAM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the theme before the app bundle loads to avoid a flash of the wrong theme. -->
    <script>
      (() => {
        const theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
